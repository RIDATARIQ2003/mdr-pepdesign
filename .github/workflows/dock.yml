name: Dock Peptides

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID — matches the jobs/{job_id}/ folder pushed by the dashboard'
        required: true
        type: string

# Needed so this workflow is allowed to commit the results back into the repo
permissions:
  contents: write

jobs:
  dock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install rdkit meeko numpy scipy

      - name: Install AutoDock Vina (Linux release binary)
        run: |
          sudo wget -q https://github.com/ccsb-scripps/AutoDock-Vina/releases/download/v1.2.7/vina_1.2.7_linux_x86_64 -O /usr/local/bin/vina
          sudo chmod +x /usr/local/bin/vina

      - name: Run docking job
        run: python scripts/dock_job.py "${{ inputs.job_id }}"

      - name: Commit and push results back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs/${{ inputs.job_id }}/results
          git commit -m "Docking results for job ${{ inputs.job_id }}" || echo "Nothing to commit"
          git push
